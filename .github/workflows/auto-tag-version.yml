name: Auto Tag Version Shared

on:
  workflow_call:
    inputs:
      plugin_file:
        required: false
        type: string
    secrets:
      github-token:
        description: 'GitHub token for creating tags and releases (use PAT to trigger other workflows)'
        required: false

permissions:
  contents: write

jobs:
  tag-version:
    name: Create tag and release from plugin version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.github-token || github.token }}

      - name: Determine plugin file
        id: determine_plugin_file
        env:
          INPUT_PLUGIN_FILE: ${{ inputs.plugin_file }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_PLUGIN_FILE}" ]; then
            PLUGIN_FILE="${INPUT_PLUGIN_FILE}"
          else
            PLUGIN_FILE="${GITHUB_REPOSITORY#*/}.php"
          fi

          echo "plugin_file=${PLUGIN_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create version tag when plugin version changes
        id: tag_version
        env:
          PLUGIN_FILE: ${{ steps.determine_plugin_file.outputs.plugin_file }}
        run: |
          set -euo pipefail

          echo "file to check is ${PLUGIN_FILE}"

          revcount=$(git rev-list --all --count)
          if [ "${revcount}" -le 1 ]; then
            echo "History too short"
            exit 0
          fi

          histdiff=$(git diff --name-only HEAD HEAD~1 | grep -Fx "${PLUGIN_FILE}" || true)
          if [ "${histdiff}" != "${PLUGIN_FILE}" ]; then
            echo "${PLUGIN_FILE} not changed"
            exit 0
          fi

          version=$(grep "Version:" "${PLUGIN_FILE}" | cut -d ':' -f 2 | xargs)

          if [ -z "${version}" ]; then
            echo "Unable to detect plugin version"
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag already exists; no action taken"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Creating new tag ${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          changeref=$(git rev-parse HEAD)

          git tag -a "${version}" "${changeref}" -m "Release version ${version}"

          git push origin "refs/tags/${version}"

          echo "created=true" >> "${GITHUB_OUTPUT}"

      - name: Prepare release notes from changelog
        if: steps.tag_version.outputs.created == 'true'
        env:
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          set -euo pipefail

          RELEASE_NOTES_FOUND=false

          # Try CHANGELOG.md first (standard format)
          if [ -f CHANGELOG.md ]; then
            echo "📝 Trying CHANGELOG.md for release notes"
            
            awk -v v="${VERSION}" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > RELEASE_NOTES.md

            if grep -q "[^[:space:]]" RELEASE_NOTES.md; then
              echo "✅ Release notes found in CHANGELOG.md"
              RELEASE_NOTES_FOUND=true
            else
              echo "⚠️ CHANGELOG.md exists but no notes found for version ${VERSION}, trying readme.txt"
            fi
          fi

          # Try readme.txt (WordPress format) if CHANGELOG.md didn't work
          if [ "$RELEASE_NOTES_FOUND" = false ] && [ -f readme.txt ]; then
            echo "📝 Trying readme.txt (WordPress format) for release notes"
            
            # Extract changelog section from WordPress readme.txt
            awk '
              /^== Changelog ==/ {found=1; next}
              found && /^[=]/ {exit}  # Exit if we hit another section
              found && NF && !started {started=1}  # Start at first non-empty line after Changelog
              started {
                if (!NF && prev !="") {exit}  # Exit at first double blank line
                if (NF) {print; prev=$0} else prev=""
              }
            ' readme.txt > RELEASE_NOTES.md

            if grep -q "[^[:space:]]" RELEASE_NOTES.md; then
              echo "✅ Release notes found in readme.txt"
              RELEASE_NOTES_FOUND=true
            else
              echo "⚠️ readme.txt exists but no notes found"
            fi
          fi

          # Fallback if no useful notes found
          if [ "$RELEASE_NOTES_FOUND" = false ]; then
            if [ -f CHANGELOG.md ] || [ -f readme.txt ]; then
              echo "⚠️ Nessuna nota release trovata per la versione ${VERSION}." > RELEASE_NOTES.md
            else
              echo "ℹ️ Nessun file changelog trovato (CHANGELOG.md o readme.txt)" > RELEASE_NOTES.md
            fi
          fi

      - name: Create GitHub release
        if: steps.tag_version.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.github-token || github.token }}
          VERSION: ${{ steps.tag_version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; no action taken"
            exit 0
          fi

          gh release create "${VERSION}" \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md